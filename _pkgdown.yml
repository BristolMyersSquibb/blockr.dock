url: https://bristolmyerssquibb.github.io/blockr.dock/
template:
  bootstrap: 5
  light-switch: true

reference:
- title: Dock board options
  desc: The board options that the dock defines.
  contents:
    - new_compact_option
    - new_view_tabs_option
    - new_sync_rails_option
- title: Dock layout
  desc: Tools for defining panel arrangements.
  contents:
    - dock_grid
- title: Dock grid
  desc: A view's geometry in canonical form.
  contents:
    - as_dock_grid
- title: Panel IDs
  desc: The canonical panel IDs a grid references.
  contents:
    - as_dock_panel_id
- title: Panel references
  desc: Typed references to block panels for the functions that write a grid.
  contents:
    - blk
