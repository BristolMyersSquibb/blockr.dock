url: https://bristolmyerssquibb.github.io/blockr.dock/
template:
  bootstrap: 5
  light-switch: true

reference:
- title: Dock plugin
  desc: The frontend that draws the page.
  contents:
    - new_dock_plugin
- title: Navbar
  desc: The items of the bar across the top of the dock.
  contents:
    - navbar_link
- title: Dock board options
  desc: The board options that the dock defines.
  contents:
    - new_compact_option
    - new_view_tabs_option
    - new_sync_rails_option
- title: The dock's state on a board
  desc: The readers of the dock's state on a board.
  contents:
    - board_views
- title: Views and folders
  desc: The views that the dock shows, and the folders that group them.
  contents:
    - dock_view
- title: Grids
  desc: Which panels a view shows, and where.
  contents:
    - dock_grid
    - is_dock_grid
- title: Panel references
  desc: The references by which a grid names the panels of blocks and plugins.
  contents:
    - blk
